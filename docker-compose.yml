# docker-compose.yml
services:
  university-bot:
    build: .
    environment:
      - MAX_TOKEN=${MAX_TOKEN}
      - MAX_API_URL=${MAX_API_URL:-https://api.max.ru}
      - DB_HOST=db
      - DB_PORT=5432
      - DB_USER=botuser
      - DB_PASSWORD=botpass
      - DB_NAME=university_bot
      - PYTHONUNBUFFERED=1
    restart: unless-stopped
    depends_on:
      - db

  db:
    image: postgres:13
    environment:
      POSTGRES_DB: university_bot
      POSTGRES_USER: botuser
      POSTGRES_PASSWORD: botpass
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  db_data: