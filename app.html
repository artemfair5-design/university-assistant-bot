<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Универ-Ассистент</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 400px;
            margin: 0 auto;
        }
        
        .header {
            text-align: center;
            color: white;
            margin-bottom: 30px;
        }
        
        .header h1 {
            font-size: 24px;
            margin-bottom: 10px;
        }
        
        .card {
            background: white;
            border-radius: 15px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.1);
        }
        
        .tab-container {
            display: flex;
            margin-bottom: 20px;
            background: #f8f9fa;
            border-radius: 10px;
            padding: 5px;
        }
        
        .tab {
            flex: 1;
            padding: 10px;
            text-align: center;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        
        .tab.active {
            background: white;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        
        .schedule-item {
            padding: 15px;
            border-left: 4px solid #667eea;
            background: #f8f9fa;
            margin-bottom: 10px;
            border-radius: 8px;
        }
        
        .project-item {
            padding: 15px;
            border: 1px solid #e9ecef;
            border-radius: 10px;
            margin-bottom: 15px;
            background: white;
        }
        
        .btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 8px;
            cursor: pointer;
            width: 100%;
            font-size: 16px;
            margin-top: 10px;
        }
        
        .hidden {
            display: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🎓 Универ-Ассистент</h1>
            <p>Ваш цифровой помощник в вузе</p>
        </div>
        
        <div class="card">
            <div class="tab-container">
                <div class="tab active" onclick="showTab('schedule')">📅 Расписание</div>
                <div class="tab" onclick="showTab('projects')">📝 Проекты</div>
                <div class="tab" onclick="showTab('documents')">🎓 Документы</div>
            </div>
            
            <!-- Расписание -->
            <div id="schedule-tab">
                <h3>Расписание на сегодня</h3>
                <div id="schedule-list">
                    <!-- Загружается через JavaScript -->
                </div>
            </div>
            
            <!-- Проекты -->
            <div id="projects-tab" class="hidden">
                <h3>Доступные проекты</h3>
                <div id="projects-list">
                    <!-- Загружается через JavaScript -->
                </div>
            </div>
            
            <!-- Документы -->
            <div id="documents-tab" class="hidden">
                <h3>Сервисы деканата</h3>
                <div style="display: grid; gap: 10px;">
                    <button class="btn" onclick="requestDocument('reference')">📄 Справка об обучении</button>
                    <button class="btn" onclick="requestDocument('academic_leave')">📝 Академический отпуск</button>
                    <button class="btn" onclick="requestDocument('transfer')">🔄 Заявление на перевод</button>
                </div>
            </div>
        </div>
        
        <div class="card">
            <h3>📚 Быстрый доступ</h3>
            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 15px;">
                <button class="btn" style="padding: 10px;" onclick="openLibrary()">Электронная библиотека</button>
                <button class="btn" style="padding: 10px;" onclick="openEvents()">Мероприятия</button>
            </div>
        </div>
    </div>

    <script>
        // Показ активной вкладки
        function showTab(tabName) {
            // Скрыть все вкладки
            document.getElementById('schedule-tab').classList.add('hidden');
            document.getElementById('projects-tab').classList.add('hidden');
            document.getElementById('documents-tab').classList.add('hidden');
            
            // Убрать активный класс со всех вкладок
            document.querySelectorAll('.tab').forEach(tab => {
                tab.classList.remove('active');
            });
            
            // Показать выбранную вкладку
            document.getElementById(tabName + '-tab').classList.remove('hidden');
            event.target.classList.add('active');
            
            // Загрузить данные если нужно
            if (tabName === 'schedule') {
                loadSchedule();
            } else if (tabName === 'projects') {
                loadProjects();
            }
        }
        
        // Загрузка расписания
        async function loadSchedule() {
            try {
                const response = await fetch('/api/schedule');
                const schedule = await response.json();
                
                const scheduleList = document.getElementById('schedule-list');
                scheduleList.innerHTML = '';
                
                schedule.today.forEach(item => {
                    const div = document.createElement('div');
                    div.className = 'schedule-item';
                    div.innerHTML = `
                        <strong>${item.time}</strong><br>
                        ${item.subject}<br>
                        <small>Аудитория: ${item.room}</small>
                    `;
                    scheduleList.appendChild(div);
                });
            } catch (error) {
                console.error('Ошибка загрузки расписания:', error);
            }
        }
        
        // Загрузка проектов
        async function loadProjects() {
            try {
                const response = await fetch('/api/projects');
                const projects = await response.json();
                
                const projectsList = document.getElementById('projects-list');
                projectsList.innerHTML = '';
                
                projects.forEach(project => {
                    const div = document.createElement('div');
                    div.className = 'project-item';
                    div.innerHTML = `
                        <h4>${project.title}</h4>
                        <p><strong>Требуются:</strong> ${project.needs}</p>
                        <p><strong>Срок:</strong> ${project.deadline}</p>
                        <p><strong>Куратор:</strong> ${project.curator}</p>
                        <button class="btn" onclick="joinProject(${project.id})">Присоединиться</button>
                    `;
                    projectsList.appendChild(div);
                });
            } catch (error) {
                console.error('Ошибка загрузки проектов:', error);
            }
        }
        
        // Функции для кнопок
        function requestDocument(type) {
            alert(`Запрос на документ "${type}" отправлен в деканат!`);
        }
        
        function joinProject(projectId) {
            alert(`Заявка на проект #${projectId} отправлена!`);
        }
        
        function openLibrary() {
            alert('Открывается электронная библиотека...');
        }
        
        function openEvents() {
            alert('Открывается календарь мероприятий...');
        }
        
        // Загрузить расписание при загрузке страницы
        document.addEventListener('DOMContentLoaded', loadSchedule);
    </script>
</body>
</html>
