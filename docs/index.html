<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>MAX мозг</title>
  <link href="https://fonts.googleapis.com/css?family=Arimo|Hind:300" rel="stylesheet">
  <link rel="stylesheet" href="styles/background.css">
  <link rel="stylesheet" href="styles/menu.css">
  <link rel="stylesheet" href="styles/components/search-bar.css">
  <link rel="stylesheet" href="styles/components/menu-buttons.css">
</head>
<body>
  <nav class="navbar">
    <div class="logo">MAX <span>мозг</span></div>
    <div class="search-container">
      <div class="search-box">
        <input type="text" class="search-input" placeholder="Поиск тем...">
        <button class="search-button">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="11" cy="11" r="8"></circle>
            <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
          </svg>
        </button>
      </div>
    </div>
    <div class="navbar-right">
      <button class="menu-button notifications">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path>
          <path d="M13.73 21a2 2 0 0 1-3.46 0"></path>
        </svg>
        <span class="badge">3</span>
      </button>
      <button class="menu-button user">
        <div class="user-avatar">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
            <circle cx="12" cy="7" r="4"></circle>
          </svg>
        </div>
      </button>
      <div class="hamburger" aria-expanded="false" aria-controls="nav-links">
        <span class="bar"></span>
        <span class="bar"></span>
        <span class="bar"></span>
      </div>
    </div>
  </nav>
  
  <ul class="nav-links">
    <li><a href="#">Главная</a></li>
    <li><a href="#">Темы</a></li>
    <li><a href="#">Профиль</a></li>
    <li><a href="#">Настройки</a></li>
  </ul>
  
  <script src="scripts/menu.js"></script>
  <script src="scripts/components/search-bar.js"></script>
  <script src="scripts/components/menu-buttons.js"></script>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script>
    if (window.Telegram?.WebApp) {
      Telegram.WebApp.ready();
      Telegram.WebApp.expand();
      Telegram.WebApp.enableClosingConfirmation();
    }
  </script>
</body>
</html>
