<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>MAX — Дашборд</title>
  <link href="https://fonts.googleapis.com/css?family=Arimo|Hind:300" rel="stylesheet">
  <link rel="stylesheet" href="styles/background.css">
  <link rel="stylesheet" href="styles/dashboard.css">
</head>
<body>
  <div class="dashboard-container">
    <div class="welcome-box">
      <div class="role-badge" id="role-badge"></div>
      <h1>Привет, <span id="role-text"></span>!</h1>
      <p class="subtitle">Это ваш персональный дашборд</p>
    </div>
  </div>

  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', function() {
      const urlParams = new URLSearchParams(window.location.search);
      const role = urlParams.get('role') || 'пользователь';
      
      document.getElementById('role-text').textContent = role;
      document.getElementById('role-badge').textContent = role;
      
      if (window.Telegram?.WebApp) {
        Telegram.WebApp.ready();
        Telegram.WebApp.expand();
        
        Telegram.WebApp.BackButton.show();
        Telegram.WebApp.BackButton.onClick(() => {
          window.location.href = 'auth.html';
        });
        
        Telegram.WebApp.MainButton
          .setText('Вернуться к выбору')
          .show()
          .onClick(() => {
            window.location.href = 'auth.html';
          });
      }
    });
  </script>
</body>
</html>
